# Render Blueprint for the RUACH learning app.
#
# Interim keep-alive (Option B): the free web service sleeps after roughly 15
# minutes of inactivity. The next request wakes it and can take about a minute
# while the service boots and reconnects to Neon.
#
# While on the free plan, an external uptime monitor (cron-job.org, UptimeRobot,
# Better Stack, or Healthchecks.io) pings GET /healthz every ~5 minutes to keep
# the service awake. /healthz is a lightweight liveness check with no database or
# auth dependency, so it is safe to poll frequently and resets Render's
# inactivity timer.
#
# Long-term fix: upgrade the service to a paid plan (e.g. starter) to remove the
# sleep behaviour entirely. Migrations remain a manual, guarded step; see MIGRATION.md.
#
# DATABASE_URL must be Neon's *pooled* connection string (the hostname usually
# contains "-pooler"). Use the direct, non-pooled string only for migrations;
# see MIGRATION.md. Do not add a Render Postgres database: the free Render
# Postgres expires and must not hold real learner data.
services:
  - type: web
    name: ruach-learning-app
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    # Schema changes remain in the guarded manual migration workflow.
    # See MIGRATION.md and M2_QUEUE_AND_DEPLOYMENT.md before rollout.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Neon pooled connection string. Set this in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false

      # Postgres/Neon tuning. Each worker allows up to 15 connections total
      # across the two gunicorn workers.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "300"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_APPLICATION_NAME
        value: ruach-learning-app

      # M5 operational telemetry. JSON logs keep request/correlation fields
      # machine-readable; thresholds tune the in-process alert evaluation.
      - key: LOG_FORMAT
        value: json
      - key: SLOW_QUERY_MS
        value: "500"
      - key: HEARTBEAT_STALE_SECONDS
        value: "300"
      - key: AI_QUEUE_ALERT_DEPTH
        value: "50"
      - key: AI_QUEUE_ALERT_AGE_SECONDS
        value: "600"

      # AI providers.
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_PRO_MODEL
        value: gemini-3.1-pro-preview
      - key: GEMINI_REQUESTS_PER_MINUTE
        value: "30"
      - key: GEMINI_REQUESTS_PER_DAY
        value: "300"
      - key: GEMINI_MAX_ATTEMPTS
        value: "3"
      - key: GEMINI_CONNECT_TIMEOUT
        value: "5"
      - key: GEMINI_READ_TIMEOUT
        value: "120"
      - key: AI_REQUEST_DEADLINE_SECONDS
        value: "50"
      - key: AI_PROVIDER_COOLDOWN_SECONDS
        value: "30"
      - key: AI_RATE_LIMIT_COOLDOWN_SECONDS
        value: "60"
      - key: AI_CACHE_ENABLED
        value: "true"
      # Optional managed Redis endpoint for cache sharing across Gunicorn
      # instances. The app retains a bounded in-memory fallback if omitted.
      - key: REDIS_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_FLASH_MODEL
        value: openrouter/auto
      - key: OPENROUTER_PRO_MODEL
        value: openrouter/auto
      - key: OPENROUTER_APP_NAME
        value: RUACH AI & ML Engineering
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_JSON_MODE
        value: "1"
      - key: OPENROUTER_MAX_TOKENS
        value: "4096"
      - key: OPENROUTER_MAX_ATTEMPTS
        value: "3"
      - key: OPENROUTER_CONNECT_TIMEOUT
        value: "5"
      - key: OPENROUTER_READ_TIMEOUT
        value: "120"

      # M2: task routing/cost telemetry/prompt rollback. Empty JSON values are
      # treated as no override by app.core.config.
      - key: AI_TASK_ROUTES
        sync: false
      - key: AI_MODEL_COSTS
        sync: false
      - key: AI_PROMPT_VERSION_OVERRIDES
        sync: false

      # Google OAuth, Gmail password reset, and optional Twilio SMS.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # W3C verifiable credentials (Ed25519). Unset: VC downloads answer 503;
      # public HMAC verification and issuance of credentials still work.
      - key: CREDENTIAL_ED25519_PRIVATE_KEY_B64
        sync: false
      - key: CREDENTIAL_ED25519_PUBLIC_KEY_B64
        sync: false
      # GitHub App webhook (direct CI verification for project submissions).
      # Unset: webhook is refused with 503 and the app falls back to manual
      # checks-URL verification. Set after registering the App; see
      # docs/GITHUB_APP_SETUP.md.
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: LESSON_EXTRAS_TOKEN
        sync: false
      # Leave disabled until a separately deployed, container-capable judge
      # worker is connected. The app then rejects authoritative submissions
      # instead of leaving them permanently queued.
      - key: JUDGE_SUBMISSIONS_ENABLED
        value: "false"
      # M3 profile/health metadata. The web service never invokes Docker; the
      # separate worker host supplies the actual image and runtime limits.
      - key: SANDBOX_IMAGE
        value: ruach-python-sandbox:3.12-v1
      - key: SANDBOX_MAX_CONCURRENCY_PER_USER
        value: "2"
      - key: SANDBOX_SUBMISSION_LIMIT_PER_MINUTE
        value: "10"
      - key: MLFLOW_TRACKING_URI
        sync: false

      # Cloudflare R2 (S3-compatible) uploads. Profile photos are written to
      # this object-storage backend only; Postgres keeps MIME metadata, plus
      # legacy BLOBs until `flask auth migrate-profile-photos` copies them.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false

  # M2: independent AI job worker. It claims durable ai_background_job rows
  # with FOR UPDATE SKIP LOCKED; no Flask request context or web port is used.
  # Run the guarded migration workflow before enabling this service so the
  # extended job columns and ai_job_result table exist.
  - type: worker
    name: ruach-ai-worker
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.ai_worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL_COSTS
        sync: false
      - key: AI_TASK_ROUTES
        sync: false
      - key: AI_PROMPT_VERSION_OVERRIDES
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: HEARTBEAT_STALE_SECONDS
        value: "300"
      - key: AI_STALE_LEASE_SECONDS
        value: "600"
      - key: SLOW_QUERY_MS
        value: "500"
      - key: WORKER_INSTANCE_ID
        sync: false

  # M5: independent ML workload. Own queue (ml_background_job), own handlers,
  # own heartbeat — never touches the AI job table or AI handlers.
  - type: worker
    name: ruach-ml-worker
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.ml_worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: HEARTBEAT_STALE_SECONDS
        value: "300"
      - key: ML_STALE_LEASE_SECONDS
        value: "600"

  # M5: scheduled maintenance process. It reuses the existing durable queue
  # and leaderboard CLI; it is not a second job system. Judge submissions stay
  # disabled in the web service and no judge-worker service is declared here.
  - type: worker
    name: ruach-scheduler
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.scheduler
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LOG_FORMAT
        value: json
      - key: HEARTBEAT_STALE_SECONDS
        value: "300"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "300"
      - key: SCHEDULED_TASKS
        value: ai-queue-reclaim
      - key: DB_APPLICATION_NAME
        value: ruach-scheduler
      - key: WORKER_INSTANCE_ID
        sync: false
