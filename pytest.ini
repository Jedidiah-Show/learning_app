[pytest]
pythonpath = .
testpaths = tests
# Markers are registered here so strict marker checking stays useful. This is
# registration only: no coverage flags or extra addopts are added, so a plain
# `pytest` run is just as fast as before. CI can opt in with
# `pytest --cov=app --cov-report=term-missing`.
#   regression: M11 "no learner disruption" smoke/regression coverage
#   migration:  Alembic upgrade/downgrade and legacy-data preservation tests
#   slow:       tests with a noticeably longer runtime; run explicitly with -m slow
markers =
    regression: M11 learner-facing regression checks (login, courses, progress, pathways, arena, projects, passport, admin)
    migration: database migration, rollback and legacy-data preservation checks
    slow: longer-running tests that can be deselected during fast local iterations
