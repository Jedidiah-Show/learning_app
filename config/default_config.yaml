app:
  name: "RUACH AI Engineering"
  version: "2.0.0"
  curriculum_days: 201 # Compatibility name: number of lessons in the bundled curriculum.

ai:
  model_tier: "flash"
  flash_model: "gemini-3.8-flash"
  pro_model: "gemini-3.1-pro-preview"

schedule:
  start_date: null
  daily_blocks:
    - name: "study"
      start_time: "18:00"
      end_time: "20:00"
      description: "RUACH AI Engineering study session"

quizzes:
  questions_per_quiz: 5
  passing_threshold: 90

google_calendar:
  enabled: true
  calendar_id: "primary"
  reminder_minutes: [30, 10]
  event_prefix: "[RUACH AI Engineering]"

progress:
  track_streaks: true
  track_time_spent: true
