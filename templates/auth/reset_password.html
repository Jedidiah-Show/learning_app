{% extends "base.html" %}

{% block title %}Choose a New Password · RUACH Engineering Course{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white shadow-lg rounded-xl border border-slate-200 p-8">
        <img src="{{ url_for('static', filename='img/ruachai.png') }}" alt="RUACH" width="60" height="60" class="mx-auto mb-4 h-14 w-14 rounded-2xl border border-gold-200 object-cover">
        <p class="brand-kicker text-center">Spirit · Connection · Growth</p>
        <h2 class="mt-2 text-center text-2xl font-bold text-slate-800 mb-2">Choose a new password</h2>
        <form method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700">New password</label>
                <div class="relative mt-1">
                    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 pr-10">
                    <button type="button" data-toggle-password="password" aria-pressed="false" aria-label="Show password" title="Show password" class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center p-1 text-slate-500 hover:text-emerald-700"><span class="password-toggle-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></button>
                </div>
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-medium text-slate-700">Confirm new password</label>
                <div class="relative mt-1">
                    <input id="confirm-password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 pr-10">
                    <button type="button" data-toggle-password="confirm-password" aria-pressed="false" aria-label="Show password" title="Show password" class="absolute right-2 top-1/2 -translate-y-1/2 flex items-center justify-center p-1 text-slate-500 hover:text-emerald-700"><span class="password-toggle-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></button>
                </div>
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white">Update password</button>
        </form>
    </div>
</div>
{% endblock %}
