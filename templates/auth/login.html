{% extends "base.html" %}

{% block title %}Login - Daily Deep-Dive Learning{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-white shadow-lg rounded-xl border border-slate-200 p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-full mb-4">
                    <span class="text-3xl">🔐</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Welcome Back</h2>
                <p class="text-slate-600">Sign in to your learning account</p>
            </div>

            <form method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="next" value="{{ next_page }}">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username or Email</label>
                    <input type="text" id="username" name="username" autocomplete="username" required value="{{ login_identifier|default('') }}"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                           placeholder="Enter your username or email">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors"
                           placeholder="Enter your password">
                </div>

                <div class="text-right">
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700">Forgot password?</a>
                </div>

                <div>
                    <button type="submit" 
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">
                    Don't have an account?
                    <a href="{{ url_for('auth.register', next=request.args.get('next')) if request.args.get('next') else url_for('auth.register') }}" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
