{% extends "base.html" %}
{% block title %}Locked · RUACH{% endblock %}
{% block content %}
<section class="mx-auto max-w-2xl rounded-3xl border border-amber-200 bg-white p-7 shadow-sm sm:p-10">
  <p class="text-xs font-bold uppercase tracking-[0.18em] text-amber-700">Not available yet</p>
  <h1 class="mt-3 text-3xl font-bold text-slate-900">{{ blocker_title }}</h1>
  <p class="mt-3 text-slate-600">{{ blocker_message }}</p>
  <div class="mt-6 flex flex-wrap gap-3">
    <a class="rounded-xl bg-brand-900 px-5 py-3 font-semibold text-white transition hover:bg-brand-800" href="{{ next_url }}">{{ next_label }} →</a>
    {% if secondary_url %}<a class="rounded-xl border border-slate-300 bg-white px-5 py-3 font-semibold text-slate-700 transition hover:bg-slate-50" href="{{ secondary_url }}">{{ secondary_label }}</a>{% endif %}
  </div>
</section>
{% endblock %}
