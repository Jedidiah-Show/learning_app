{% extends "base.html" %}
{% block title %}Problem Catalogue · Practice Arena{% endblock %}
{% block content %}
<section class="mx-auto max-w-6xl px-4 py-10">
  <header class="mb-8">
    <a href="{{ url_for('practice_arena.index') }}" class="text-sm text-indigo-600">← Back to Arena</a>
    <h1 class="mt-2 text-3xl font-bold text-slate-900">Problem Catalogue</h1>
  </header>
  <div class="grid gap-4">
    {% for exercise in exercises %}
    <article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
      <h3 class="font-bold text-slate-900">{{ exercise.title }}</h3>
      <p class="text-sm text-slate-600 mt-1">{{ exercise.lesson_id }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
