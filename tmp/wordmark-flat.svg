  <!-- u -->
  <path class="s" d="M 126 110 C 116 132, 128 156, 140 168 C 150 156, 140 130, 126 110 Z"/>
  <path class="h" stroke-width="5" d="M 140 168 C 152 176, 164 168, 168 150"/>
  <path class="s" d="M 170 110 C 160 130, 170 150, 178 166 C 188 150, 180 128, 170 110 Z"/>
  <path class="h" stroke-width="5" d="M 178 166 C 186 172, 194 166, 198 156"/>
  <!-- a -->
  <path class="s" d="M 250 112 C 222 100, 202 120, 203 141 C 204 162, 224 175, 245 166 L 243 156 C 227 162, 215 153, 214 141 C 213 127, 227 115, 246 121 Z"/>
  <path class="s" d="M 250 108 C 242 128, 248 150, 256 168 C 266 150, 260 126, 250 108 Z"/>
  <path class="h" stroke-width="5" d="M 256 168 C 266 172, 276 164, 281 152"/>
