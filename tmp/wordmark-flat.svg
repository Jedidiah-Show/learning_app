<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Ruach">
  <title>Ruach</title>
  <defs>
    <linearGradient id="ruach-ink" gradientUnits="userSpaceOnUse" x1="30" y1="175" x2="570" y2="60">
      <stop offset="0" style="stop-color: #083D2E"/>
      <stop offset="0.45" style="stop-color: #1B6A5B"/>
      <stop offset="1" style="stop-color: #2FA38A"/>
