[project]
# Vercel's Python runtime installs dependencies from pyproject.toml via uv;
# requirements.txt covers Render/gunicorn, so keep both lists in sync.
name = "ruach-learning-app"
version = "1.1.0"
description = "RUACH AI & ML Engineering learning app"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.0.3",
  "Flask-SQLAlchemy==3.1.1",
  "Flask-Migrate==4.0.7",
  "cryptography==50.0.2",
  "psycopg[binary]==3.3.9",
  "Flask-Login==0.6.3",
  "google-api-python-client==2.108.0",
  "google-auth-httplib2==0.1.1",
  "google-auth-oauthlib==1.1.0",
  "PyYAML==6.0.3",
  "requests==2.32.5",
  "python-dotenv==1.2.4",
  "Werkzeug==3.0.6",
  "gunicorn==23.0.0",
  "boto3==1.40.0",
  "redis==8.2.0",
  "python-dateutil==2.9.0.post0",
  "tzdata==2026.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "migrations/versions",
  "static",
  "node_modules",
  ".venv",
  "instance",
]

[tool.ruff.lint]
select = ["E9", "F", "B006", "B007", "B012"]
# High-signal correctness + common bugbear traps. Broaden further as codebase
# is cleaned; avoid noisy style-only rules until baseline is stable.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = false
check_untyped_defs = false
disallow_untyped_defs = false
files = [
  "app/core",
  "app/services/authorization.py",
  "app/services/project_completion.py",
  "app/services/project_review_contract.py",
  "app/services/project_starter_kits.py",
  "app/services/lesson_completion.py",
  "app/services/password_reset.py",
  "app/services/video_progress.py",
  "app/services/search_index.py",
]
exclude = "(migrations/|tests/|static/|node_modules/|.venv/)"
