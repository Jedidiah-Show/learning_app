name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      GEMINI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GOOGLE_REDIRECT_URI: ''
      DATABASE_URL: sqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests migrations index.py wsgi.py
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend build tools
        run: npm ci
      - name: Build frontend assets
        run: |
          npm run build:css
          npm run build:js
          node --check static/js/practice-sandbox.js
      - name: Verify compiled assets are current
        run: git diff --exit-code -- static/css/tailwind.css static/js/practice.bundle.js

  browser-ide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the browser Python runtime
        run: npm run test:browser
