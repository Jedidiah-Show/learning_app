name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      GEMINI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GOOGLE_REDIRECT_URI: ''
      DATABASE_URL: sqlite:///ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests migrations index.py wsgi.py
      - name: Check dependency consistency
        run: python -m pip check
      - name: Repository hygiene check
        run: |
          if git ls-files | grep -E '\.(env|env\.local|pem|key)$' | grep -v '\.env\.example'; then
            echo 'Prohibited environment/secret files tracked' && exit 1
          fi
          if git ls-files | grep -E '^\.qoder/|\.qoder/settings'; then
            echo 'Local editor settings tracked' && exit 1
          fi
          echo 'Repository hygiene OK'
      - name: Basic secret pattern scan
        run: |
          if git grep -n -I -E '(AKIA[0-9A-Z]{16}|sk_live_[0-9a-zA-Z]{24}|ghp_[A-Za-z0-9]{36}|xox[baprs]-[0-9a-zA-Z-]+)' -- ':!node_modules' ':!.venv' ':!*.lock' 2>&1 | grep -v '.github/workflows/ci.yml'; then
            echo 'Potential secrets found' && exit 1
          fi
          echo 'Secret pattern scan OK'
      - name: Run tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend build tools
        run: npm ci
      - name: Build frontend assets
        run: |
          npm run build:css
          npm run build:js
          node --check static/js/practice-sandbox.js
      - name: Verify compiled assets are current
        run: git diff --exit-code -- static/css/tailwind.css static/js/practice.bundle.js

  browser-ide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the browser Python runtime
        run: npm run test:browser
